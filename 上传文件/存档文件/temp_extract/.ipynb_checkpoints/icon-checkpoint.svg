<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>

  <!-- 视频播放图标 -->
  <g transform="translate(100, 100)">
    <!-- 外圈 -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>

    <!-- 播放三角形 -->
    <path d="M -20,-30 L -20,30 L 35,0 Z" fill="white"/>

    <!-- 装饰元素 - 小圆点 -->
    <circle cx="-45" cy="-45" r="5" fill="white" opacity="0.6"/>
    <circle cx="45" cy="-45" r="5" fill="white" opacity="0.6"/>
    <circle cx="45" cy="45" r="5" fill="white" opacity="0.6"/>
    <circle cx="-45" cy="45" r="5" fill="white" opacity="0.6"/>
  </g>

  <!-- 底部文字 -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">SORA2</text>
</svg>
