# 基础信息
author: wwwzhouhui
created_at: '2025-10-02T10:00:00.000000000Z'
description:
  en_US: AI text-to-video generation plugin powered by 302.AI Sora-2 model
  zh_CN: 基于 302.AI Sora-2 模型的 AI 文生视频插件
icon: icon.svg
label:
  en_US: Sora2 Text to Video
  zh_CN: Sora2 文生视频

# 元数据配置
meta:
  arch: [amd64, arm64]
  runner:
    entrypoint: main
    language: python
    version: '3.12'
  version: 0.0.1

# 插件配置
name: sora2_text2video
plugins:
  tools:
  - provider/sora2.yaml

# 资源配置
resource:
  memory: 2097152
  permission:
    model:
      enabled: true
      llm: true
    tool:
      enabled: true

# 标签和类型
tags: [video, ai-generation]
type: plugin
version: 0.0.1
