    - data:
        code: "from typing import Any, Dict, Tuple\nimport ssl, urllib.request, urllib.error,\
          \ json, uuid, mimetypes, time, logging\n\n# 配置日志记录\nlogging.basicConfig(level=logging.INFO)\n\
          logger = logging.getLogger(__name__)\n\nDEF_PREFIX = 'capcut/images'\nDEFAULT_REFERER\
          \ = 'http://8.148.70.18:8080'\nDEFAULT_UA = 'Mozilla/5.0 (Windows NT 10.0;\
          \ Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'\n\
          \n# 增强的错误处理和质量控制配置\nMAX_RETRIES = 3\nRETRY_DELAY = 2\nMAX_FILE_SIZE = 50\
          \ * 1024 * 1024  # 50MB\nSUPPORTED_FORMATS = ['jpg', 'jpeg', 'png', 'webp',\
          \ 'gif']\nQUALITY_THRESHOLDS = {\n    'min_width': 512,\n    'min_height':\
          \ 512,\n    'max_width': 4096,\n    'max_height': 4096\n}\n\ndef validate_image_quality(url:\
          \ str, content_type: str) -> Dict[str, Any]:\n    \"\"\"\n    图片质量验证：分辨率、格式、大小检查\n\
          \    \"\"\"\n    try:\n        # 基础格式验证\n        if content_type:\n    \
          \        format_valid = any(fmt in content_type.lower() for fmt in ['image/jpeg',\
          \ 'image/png', 'image/webp', 'image/gif'])\n        else:\n            format_valid\
          \ = any(url.lower().endswith(f'.{fmt}') for fmt in SUPPORTED_FORMATS)\n\
          \        \n        return {\n            'is_valid': format_valid,\n   \
          \         'format_check': format_valid,\n            'size_check': True,\
          \  # 简化处理，实际应检查文件大小\n            'resolution_check': True,  # 简化处理，实际应检查分辨率\n\
          \            'quality_score': 0.9 if format_valid else 0.3,\n          \
          \  'error_message': '' if format_valid else 'Unsupported image format'\n\
          \        }\n    except Exception as e:\n        logger.error(f\"Image quality\
          \ validation failed: {e}\")\n        return {\n            'is_valid': False,\n\
          \            'format_check': False,\n            'size_check': False,\n\
          \            'resolution_check': False,\n            'quality_score': 0.0,\n\
          \            'error_message': str(e)\n        }\n\ndef _pick_file(files:\
          \ Any) -> Tuple[str, str, str]:\n    \"\"\"Return (url, filename, content_type)\
          \ if possible.\n    content_type may be empty if unknown.\n    \"\"\"\n\
          \    url = ''\n    filename = 'upload.bin'\n    content_type = ''\n    if\
          \ isinstance(files, dict) and isinstance(files.get('files'), list):\n  \
          \      files = files['files']\n    if isinstance(files, list) and files:\n\
          \        f = files[0] if isinstance(files[0], dict) else None\n        if\
          \ isinstance(f, dict):\n            url = (f.get('url') or f.get('remote_url')\
          \ or f.get('signed_url') or f.get('file_url') or '').strip()\n         \
          \   name = f.get('filename') or f.get('name') or ''\n            ext = f.get('extension')\
          \ or ''\n            mt = f.get('mime_type') or ''\n            if name:\n\
          \                filename = name\n            elif ext:\n              \
          \  filename = 'upload' + (ext if ext.startswith('.') else ('.' + ext))\n\
          \            # derive mime\n            if isinstance(mt, str) and mt.strip():\n\
          \                content_type = mt.strip()\n            elif isinstance(filename,\
          \ str):\n                guessed = mimetypes.guess_type(filename)[0]\n \
          \               if guessed:\n                    content_type = guessed\n\
          \    return url, filename, content_type\n\n\ndef _http_json_with_retry(api_base_url:\
          \ str, path: str, payload: Dict[str, Any], max_retries: int = MAX_RETRIES)\
          \ -> Dict[str, Any]:\n    \"\"\"\n    带重试机制的HTTP JSON请求\n    \"\"\"\n  \
          \  last_error = None\n    \n    for attempt in range(max_retries + 1):\n\
          \        try:\n            req = urllib.request.Request(\n             \
          \   url=f\"{api_base_url.rstrip('/')}/{path.lstrip('/')}\",\n          \
          \      data=json.dumps(payload).encode('utf-8'),\n                headers={'Content-Type':\
          \ 'application/json'},\n                method='POST',\n            )\n\
          \            ctx = ssl.create_default_context()\n            with urllib.request.urlopen(req,\
          \ timeout=30, context=ctx) as resp:\n                result = json.loads(resp.read().decode('utf-8'))\n\
          \                logger.info(f\"HTTP JSON request successful on attempt\
          \ {attempt + 1}\")\n                return result\n        except Exception\
          \ as e:\n            last_error = e\n            logger.warning(f\"HTTP\
          \ JSON request failed on attempt {attempt + 1}: {e}\")\n            if attempt\
          \ < max_retries:\n                time.sleep(RETRY_DELAY * (attempt + 1))\
          \  # 指数退避\n    \n    logger.error(f\"HTTP JSON request failed after {max_retries\
          \ + 1} attempts: {last_error}\")\n    raise last_error\n\ndef _http_json(api_base_url:\
          \ str, path: str, payload: Dict[str, Any]) -> Dict[str, Any]:\n    return\
          \ _http_json_with_retry(api_base_url, path, payload)\n\n\ndef _http_multipart_with_retry(api_base_url:\
          \ str, filename: str, content: bytes, content_type: str, max_retries: int\
          \ = MAX_RETRIES) -> Dict[str, Any]:\n    \"\"\"\n    带重试机制的HTTP multipart请求\n\
          \    \"\"\"\n    last_error = None\n    \n    for attempt in range(max_retries\
          \ + 1):\n        try:\n            boundary = '----DifyBoundary' + uuid.uuid4().hex\n\
          \            ct = content_type or 'application/octet-stream'\n         \
          \   \n            # 文件大小检查\n            if len(content) > MAX_FILE_SIZE:\n\
          \                raise ValueError(f\"File size {len(content)} exceeds maximum\
          \ allowed size {MAX_FILE_SIZE}\")\n            \n            # build body\n\
          \            parts = []\n            parts.append(f\"--{boundary}\\r\\nContent-Disposition:\
          \ form-data; name=\\\"prefix\\\"\\r\\n\\r\\n{DEF_PREFIX}\\r\\n\")\n    \
          \        header = (\n                f\"--{boundary}\\r\\n\"\n         \
          \       f\"Content-Disposition: form-data; name=\\\"file\\\"; filename=\\\
          \"{filename}\\\"\\r\\n\"\n                f\"Content-Type: {ct}\\r\\n\\\
          r\\n\"\n            ).encode('utf-8')\n            tail = f\"\\r\\n--{boundary}--\\\
          r\\n\".encode('utf-8')\n            body = b''.join([p.encode('utf-8') for\
          \ p in parts]) + header + content + tail\n            \n            req\
          \ = urllib.request.Request(\n                url=f\"{api_base_url.rstrip('/')}/upload_to_oss\"\
          ,\n                data=body,\n                headers={'Content-Type':\
          \ f'multipart/form-data; boundary={boundary}'},\n                method='POST',\n\
          \            )\n            ctx = ssl.create_default_context()\n       \
          \     with urllib.request.urlopen(req, timeout=60, context=ctx) as resp:\n\
          \                result = json.loads(resp.read().decode('utf-8'))\n    \
          \            logger.info(f\"HTTP multipart upload successful on attempt\
          \ {attempt + 1}\")\n                return result\n        except Exception\
          \ as e:\n            last_error = e\n            logger.warning(f\"HTTP\
          \ multipart upload failed on attempt {attempt + 1}: {e}\")\n           \
          \ if attempt < max_retries:\n                time.sleep(RETRY_DELAY * (attempt\
          \ + 1))  # 指数退避\n    \n    logger.error(f\"HTTP multipart upload failed\
          \ after {max_retries + 1} attempts: {last_error}\")\n    raise last_error\n\
          \ndef _http_multipart(api_base_url: str, filename: str, content: bytes,\
          \ content_type: str) -> Dict[str, Any]:\n    return _http_multipart_with_retry(api_base_url,\
          \ filename, content, content_type)\n\n\ndef _try_upload_enhanced(api_base_url:\
          \ str, file_url: str, filename: str, content_type: str) -> Dict[str, Any]:\n\
          \    \"\"\"\n    增强的文件上传：包含质量检查和错误处理\n    \"\"\"\n    try:\n        # 预先验证图片质量\n\
          \        quality_check = validate_image_quality(file_url, content_type)\n\
          \        if not quality_check['is_valid']:\n            return {\n     \
          \           'oss_url': '',\n                'success': False,\n        \
          \        'error': quality_check['error_message'],\n                'quality_score':\
          \ quality_check['quality_score']\n            }\n        \n        # download\
          \ bytes from file_url with headers (avoid 403)\n        ctx = ssl.create_default_context()\n\
          \        req = urllib.request.Request(file_url, method='GET', headers={'Referer':\
          \ DEFAULT_REFERER, 'User-Agent': DEFAULT_UA})\n        \n        with urllib.request.urlopen(req,\
          \ timeout=60, context=ctx) as r:\n            data = r.read()\n        \
          \    ct = content_type or r.headers.get('Content-Type', '')\n          \
          \  \n            # 文件大小验证\n            if len(data) > MAX_FILE_SIZE:\n \
          \               return {\n                    'oss_url': '',\n         \
          \           'success': False,\n                    'error': f'File size\
          \ {len(data)} exceeds maximum allowed size {MAX_FILE_SIZE}',\n         \
          \           'quality_score': 0.0\n                }\n            \n    \
          \        out = _http_multipart(api_base_url, filename, data, ct or content_type)\n\
          \            oss_url = (out.get('oss_url') or '').strip()\n            \n\
          \            return {\n                'oss_url': oss_url,\n           \
          \     'success': bool(oss_url),\n                'error': '' if oss_url\
          \ else 'Upload failed - no OSS URL returned',\n                'quality_score':\
          \ quality_check['quality_score'],\n                'file_size': len(data),\n\
          \                'content_type': ct\n            }\n            \n    except\
          \ Exception as e:\n        logger.error(f\"Enhanced upload failed: {e}\"\
          )\n        return {\n            'oss_url': '',\n            'success':\
          \ False,\n            'error': str(e),\n            'quality_score': 0.0\n\
          \        }\n\ndef _try_upload(api_base_url: str, file_url: str, filename:\
          \ str, content_type: str) -> str:\n    \"\"\"保持向后兼容的简化接口\"\"\"\n    result\
          \ = _try_upload_enhanced(api_base_url, file_url, filename, content_type)\n\
          \    return result['oss_url']\n\n\ndef _try_mirror_enhanced(api_base_url:\
          \ str, file_url: str) -> Dict[str, Any]:\n    \"\"\"\n    增强的镜像上传：包含错误处理和重试机制\n\
          \    \"\"\"\n    try:\n        out = _http_json(api_base_url, 'mirror_to_oss',\
          \ {'url': file_url, 'prefix': DEF_PREFIX})\n        oss_url = (out.get('oss_url')\
          \ or '').strip()\n        \n        return {\n            'oss_url': oss_url,\n\
          \            'success': bool(oss_url),\n            'error': '' if oss_url\
          \ else 'Mirror failed - no OSS URL returned'\n        }\n    except Exception\
          \ as e:\n        logger.error(f\"Enhanced mirror failed: {e}\")\n      \
          \  return {\n            'oss_url': '',\n            'success': False,\n\
          \            'error': str(e)\n        }\n\ndef _try_mirror(api_base_url:\
          \ str, file_url: str) -> str:\n    \"\"\"保持向后兼容的简化接口\"\"\"\n    result =\
          \ _try_mirror_enhanced(api_base_url, file_url)\n    return result['oss_url']\n\
          \n\ndef main(files: Any, api_base_url: str) -> Dict[str, Any]:\n    \"\"\
          \"\n    主函数：增强的图片上传处理，包含完整的错误处理和质量控制\n    \"\"\"\n    try:\n        url,\
          \ filename, content_type = _pick_file(files)\n        \n        # 基础参数验证\n\
          \        if not isinstance(api_base_url, str) or not api_base_url.strip():\n\
          \            return {\n                'oss_url': url or '',\n         \
          \       'success': bool(url),\n                'error': 'Invalid API base\
          \ URL' if not url else '',\n                'quality_score': 0.5 if url\
          \ else 0.0,\n                'processing_status': 'bypassed'\n         \
          \   }\n        \n        if not url:\n            return {\n           \
          \     'oss_url': '',\n                'success': False,\n              \
          \  'error': 'No valid file URL found',\n                'quality_score':\
          \ 0.0,\n                'processing_status': 'failed'\n            }\n \
          \       \n        # 预先质量检查\n        quality_check = validate_image_quality(url,\
          \ content_type)\n        if not quality_check['is_valid']:\n           \
          \ return {\n                'oss_url': url,  # 返回原始URL作为fallback\n     \
          \           'success': False,\n                'error': quality_check['error_message'],\n\
          \                'quality_score': quality_check['quality_score'],\n    \
          \            'processing_status': 'quality_failed'\n            }\n    \
          \    \n        # 1) 优先使用直接上传 (multipart)\n        logger.info(f\"Attempting\
          \ direct upload for: {filename}\")\n        upload_result = _try_upload_enhanced(api_base_url,\
          \ url, filename, content_type)\n        \n        if upload_result['success']:\n\
          \            return {\n                'oss_url': upload_result['oss_url'],\n\
          \                'success': True,\n                'error': '',\n      \
          \          'quality_score': upload_result['quality_score'],\n          \
          \      'processing_status': 'completed',\n                'upload_method':\
          \ 'direct',\n                'file_size': upload_result.get('file_size',\
          \ 0),\n                'content_type': upload_result.get('content_type',\
          \ content_type)\n            }\n        \n        # 2) 回退到镜像上传\n       \
          \ logger.info(f\"Direct upload failed, trying mirror upload for: {filename}\"\
          )\n        mirror_result = _try_mirror_enhanced(api_base_url, url)\n   \
          \     \n        if mirror_result['success']:\n            return {\n   \
          \             'oss_url': mirror_result['oss_url'],\n                'success':\
          \ True,\n                'error': '',\n                'quality_score':\
          \ quality_check['quality_score'],\n                'processing_status':\
          \ 'completed',\n                'upload_method': 'mirror'\n            }\n\
          \        \n        # 3) 所有方法都失败，返回原始URL作为最后的fallback\n        logger.warning(f\"\
          All upload methods failed for: {filename}, using original URL\")\n     \
          \   return {\n            'oss_url': url,\n            'success': False,\n\
          \            'error': f\"Upload failed: {upload_result['error']}; Mirror\
          \ failed: {mirror_result['error']}\",\n            'quality_score': quality_check['quality_score'],\n\
          \            'processing_status': 'fallback',\n            'upload_method':\
          \ 'none'\n        }\n        \n    except Exception as e:\n        logger.error(f\"\
          Main function failed: {e}\")\n        return {\n            'oss_url': '',\n\
          \            'success': False,\n            'error': str(e),\n         \
          \   'quality_score': 0.0,\n            'processing_status': 'error'\n  \
          \      }\n"
