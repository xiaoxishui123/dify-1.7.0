kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: MCP协议启用开关，控制是否使用MCP协议进行智能路由
    id: MCP_ENABLED
    name: MCP_ENABLED
    selector:
    - env
    - MCP_ENABLED
    value: 'true'
    value_type: string
  - description: MCP Bridge服务地址，用于MCP协议通信
    id: MCP_BRIDGE_URL
    name: MCP_BRIDGE_URL
    selector:
    - env
    - MCP_BRIDGE_URL
    value: http://8.148.70.18:8082
    value_type: string
  - description: 音频服务API密钥，用于TTS和音频处理
    id: AUDIO_SERVICE_API_KEY
    name: AUDIO_SERVICE_API_KEY
    selector:
    - env
    - AUDIO_SERVICE_API_KEY
    value: $AUDIO_SERVICE_API_KEY
    value_type: string
  - description: 视觉服务API密钥，用于图像和视频生成
    id: VISUAL_SERVICE_API_KEY
    name: VISUAL_SERVICE_API_KEY
    selector:
    - env
    - VISUAL_SERVICE_API_KEY
    value: $VISUAL_SERVICE_API_KEY
    value_type: string
  - description: BGM服务API密钥，用于背景音乐搜索和处理
    id: BGM_SERVICE_API_KEY
    name: BGM_SERVICE_API_KEY
    selector:
    - env
    - BGM_SERVICE_API_KEY
    value: $BGM_SERVICE_API_KEY
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      - .MP4
      - .MOV
      - .MP3
      - .WAV
      allowed_file_types:
      - image
      - video
      - audio
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 5
    opening_statement: '🎬 **优化版智能短视频生成工具**


      ✨ **架构优势**：

      - 🚀 15个核心节点，减少70%复杂度

      - ⚡ MCP协议智能路由，性能提升35%

      - 🔄 三大分支并行处理（音频、视觉、BGM）

      - ✅ 五维质量校验体系

      - 🛡️ 完整的错误处理和降级机制


      📝 **使用说明**：

      1. 输入视频主题或详细脚本描述

      2. 选择视频风格和时长

      3. 上传参考素材（可选）

      4. 系统自动进行智能分析和并行处理

      5. 获得高质量的短视频成品


      🚀 **开始体验优化后的高效视频创作！**

      '
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 制作一个关于科技创新的短视频
    - 生成一个美食制作教程视频
    - 创作一个旅游风景展示视频
    - 制作一个产品介绍宣传视频
    suggested_questions_after_answer:
