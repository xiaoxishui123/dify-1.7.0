          \ \n    completeness_ratio = complete_data_count / len(candidates)\n   \
          \ \n    # 质量评级\n    if avg_score >= 0.8 and completeness_ratio >= 0.9:\n\
          \        quality = 'excellent'\n    elif avg_score >= 0.6 and completeness_ratio\
          \ >= 0.7:\n        quality = 'good'\n    elif avg_score >= 0.4 and completeness_ratio\
