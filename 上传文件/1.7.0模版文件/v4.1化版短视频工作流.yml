    - data:
        code: "import json\nimport re\nfrom typing import Dict, Any, List, Optional\n\
          \ndef main(storyboard_text: str, user_content: str, video_duration: str,\
          \ video_style: Optional[str], aspect_ratio: str) -> Dict[str, Any]:\n  \
          \  \"\"\"\n    解析分镜脚本，生成结构化数据\n    增强了空值处理和错误处理机制\n    \"\"\"\n    try:\n\
          \        # 参数安全处理和验证\n        if not storyboard_text or not storyboard_text.strip():\n\
          \            raise ValueError(\"分镜脚本内容为空\")\n        \n        if not user_content\
          \ or not user_content.strip():\n            raise ValueError(\"用户内容为空\"\
          )\n        \n        # 安全处理video_duration参数\n        try:\n            duration_int\
          \ = int(video_duration) if video_duration and video_duration.strip() else\
          \ 60\n            if duration_int <= 0:\n                duration_int =\
          \ 60\n        except (ValueError, TypeError):\n            duration_int\
          \ = 60\n        \n        # 安全处理video_style参数\n        safe_video_style\
          \ = video_style if video_style and video_style.strip() and video_style.lower()\
          \ != 'null' else '现代简约'\n        \n        # 安全处理aspect_ratio参数\n      \
          \  safe_aspect_ratio = aspect_ratio if aspect_ratio and aspect_ratio.strip()\
          \ else '16:9'\n        \n        # 尝试解析JSON格式的分镜脚本\n        storyboard_text_clean\
          \ = storyboard_text.strip()\n        if storyboard_text_clean.startswith('{')\
          \ or storyboard_text_clean.startswith('['):\n            try:\n        \
          \        storyboard_data = json.loads(storyboard_text_clean)\n         \
          \   except json.JSONDecodeError as e:\n                # JSON解析失败，进行文本解析\n\
          \                storyboard_data = parse_text_storyboard(storyboard_text_clean)\n\
          \        else:\n            # 如果不是JSON，进行文本解析\n            storyboard_data\
          \ = parse_text_storyboard(storyboard_text_clean)\n        \n        # 标准化数据结构\n\
          \        segments = storyboard_data.get('segments', [])\n        if not\
          \ segments or not isinstance(segments, list):\n            # 创建默认分镜\n  \
          \          segments = create_default_segments(user_content, duration_int)\n\
          \        \n        # 生成处理任务\n        audio_segments = []\n        visual_segments\
          \ = []\n        bgm_queries = []\n        \n        for i, segment in enumerate(segments):\n\
          \            if not isinstance(segment, dict):\n                continue\n\
          \                \n            # 音频片段\n            audio_segments.append({\n\
          \                'segment_id': f'audio_{i+1}',\n                'text':\
          \ str(segment.get('text_content', f'{user_content}的第{i+1}部分内容')),\n    \
          \            'duration': max(1, int(segment.get('duration', 5))),\n    \
          \            'voice_style': 'natural',\n                'emotion': str(segment.get('emotion',\
          \ 'neutral'))\n            })\n            \n            # 视觉片段\n      \
          \      visual_segments.append({\n                'segment_id': f'visual_{i+1}',\n\
          \                'scene_description': str(segment.get('scene_description',\
          \ f'{user_content} - 第{i+1}个场景')),\n                'duration': max(1, int(segment.get('duration',\
          \ 5))),\n                'style': safe_video_style,\n                'aspect_ratio':\
          \ safe_aspect_ratio\n            })\n            \n            # BGM查询\n\
          \            bgm_queries.append({\n                'query_id': f'bgm_{i+1}',\n\
          \                'mood': str(segment.get('bgm_mood', 'neutral')),\n    \
          \            'style': safe_video_style,\n                'duration': max(1,\
          \ int(segment.get('duration', 5)))\n            })\n        \n        #\
          \ 确保至少有一个片段\n        if not audio_segments:\n            audio_segments\
          \ = [{\n                'segment_id': 'audio_1',\n                'text':\
          \ user_content,\n                'duration': duration_int,\n           \
          \     'voice_style': 'natural',\n                'emotion': 'neutral'\n\
          \            }]\n        \n        if not visual_segments:\n           \
          \ visual_segments = [{\n                'segment_id': 'visual_1',\n    \
          \            'scene_description': f'{user_content} - 主要场景',\n          \
          \      'duration': duration_int,\n                'style': safe_video_style,\n\
          \                'aspect_ratio': safe_aspect_ratio\n            }]\n   \
          \     \n        if not bgm_queries:\n            bgm_queries = [{\n    \
          \            'query_id': 'bgm_1',\n                'mood': 'neutral',\n\
          \                'style': safe_video_style,\n                'duration':\
          \ duration_int\n            }]\n        \n        return {\n           \
          \ 'storyboard_data': storyboard_data,\n            'audio_segments': audio_segments,\n\
          \            'visual_segments': visual_segments,\n            'bgm_queries':\
          \ bgm_queries,\n            'total_segments': len(segments),\n         \
          \   'total_duration': sum(seg.get('duration', 5) for seg in audio_segments),\n\
          \            'processing_config': {\n                'video_style': safe_video_style,\n\
          \                'aspect_ratio': safe_aspect_ratio,\n                'quality_preset':\
          \ 'high'\n            },\n            'error': '',\n            'fallback_used':\
          \ False\n        }\n    \n    except Exception as e:\n        # 增强的错误处理，提供降级方案\n\
          \        safe_video_style = video_style if video_style and video_style.strip()\
          \ and video_style.lower() != 'null' else '现代简约'\n        safe_aspect_ratio\
          \ = aspect_ratio if aspect_ratio and aspect_ratio.strip() else '16:9'\n\
          \        try:\n            duration_int = int(video_duration) if video_duration\
          \ and video_duration.strip() else 15\n        except:\n            duration_int\
          \ = 15\n        \n        # 提供基本的降级数据\n        fallback_audio = [{\n   \
          \         'segment_id': 'audio_1',\n            'text': user_content or\
          \ '默认内容',\n            'duration': duration_int,\n            'voice_style':\
          \ 'natural',\n            'emotion': 'neutral'\n        }]\n        \n \
          \       fallback_visual = [{\n            'segment_id': 'visual_1',\n  \
          \          'scene_description': f'{user_content or \"默认内容\"} - 主要场景',\n\
          \            'duration': duration_int,\n            'style': safe_video_style,\n\
          \            'aspect_ratio': safe_aspect_ratio\n        }]\n        \n \
          \       fallback_bgm = [{\n            'query_id': 'bgm_1',\n          \
          \  'mood': 'neutral',\n            'style': safe_video_style,\n        \
          \    'duration': duration_int\n        }]\n        \n        return {\n\
          \            'error': f'解析错误: {str(e)}',\n            'storyboard_data':\
          \ {'segments': []},\n            'audio_segments': fallback_audio,\n   \
          \         'visual_segments': fallback_visual,\n            'bgm_queries':\
          \ fallback_bgm,\n            'total_segments': 1,\n            'total_duration':\
          \ duration_int,\n            'processing_config': {\n                'video_style':\
          \ safe_video_style,\n                'aspect_ratio': safe_aspect_ratio,\n\
          \                'quality_preset': 'high'\n            },\n            'fallback_used':\
          \ True\n        }\n\ndef parse_text_storyboard(text: str) -> Dict[str, Any]:\n\
          \    \"\"\"解析文本格式的分镜脚本\"\"\"\n    segments = []\n    lines = text.split('\\\
          n')\n    current_segment = {}\n    \n    for line in lines:\n        line\
          \ = line.strip()\n        if not line:\n            continue\n        \n\
          \        if '分镜' in line or '场景' in line:\n            if current_segment:\n\
          \                segments.append(current_segment)\n            current_segment\
          \ = {'scene_description': line}\n        elif '文案' in line or '旁白' in line:\n\
          \            current_segment['text_content'] = line\n        elif '时长' in\
          \ line:\n            duration_match = re.search(r'(\\d+)', line)\n     \
          \       if duration_match:\n                try:\n                    current_segment['duration']\
          \ = int(duration_match.group(1))\n                except ValueError:\n \
          \                   current_segment['duration'] = 5\n    \n    if current_segment:\n\
          \        segments.append(current_segment)\n    \n    return {'segments':\
          \ segments}\n\ndef create_default_segments(content: str, duration: int)\
          \ -> List[Dict[str, Any]]:\n    \"\"\"创建默认分镜\"\"\"\n    try:\n        segment_count\
          \ = max(1, min(5, duration // 15)) if duration > 0 else 1\n        segment_duration\
          \ = max(1, duration // segment_count) if segment_count > 0 else duration\n\
          \    except:\n        segment_count = 1\n        segment_duration = duration\
          \ if duration > 0 else 15\n    \n    segments = []\n    for i in range(segment_count):\n\
          \        segments.append({\n            'scene_description': f'{content}\
          \ - 第{i+1}个场景',\n            'text_content': f'{content}的第{i+1}部分内容',\n\
          \            'duration': segment_duration,\n            'emotion': 'neutral',\n\
          \            'bgm_mood': 'upbeat' if i % 2 == 0 else 'calm'\n        })\n\
          \    \n    return segments\n"
        code_language: python3
        desc: Python3脚本解析，JSON结构化输出
