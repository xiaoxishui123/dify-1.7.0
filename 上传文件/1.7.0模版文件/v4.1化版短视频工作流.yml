          \ False,\n            'overall_complete': False,\n            'audio_count':\
          \ 0,\n            'visual_count': 0,\n            'bgm_count': 0,\n    \
          \        'total_count': 0,\n            'completeness_score': 0.0\n    \
          \    },\n        'quality_assessment': {\n            'audio_quality': 0.0,\n\
          \            'visual_quality': 0.0,\n            'bgm_quality': 0.0,\n \
          \           'overall_quality': 0.0,\n            'quality_grade': 'F'\n\
          \        }\n    }\n"
