          \    \n    overall_quality = (audio_quality + visual_quality + bgm_quality)\
          \ / 3 if (audio or visual or bgm) else 0.0\n    \n    return {\n       \
          \ 'audio_quality': audio_quality,\n        'visual_quality': visual_quality,\n\
          \        'bgm_quality': bgm_quality,\n        'overall_quality': overall_quality,\n\
          \        'quality_grade': get_quality_grade(overall_quality)\n    }\n\n\
          def calculate_completeness_score(audio: List[Dict], visual: List[Dict],\
          \ bgm: List[Dict]) -> float:\n    \"\"\"\n    计算完整性分数\n    \"\"\"\n    score\
          \ = 0.0\n    \n    # 基础完整性（60%权重）\n    if audio:\n        score += 0.3\n\
          \    if visual:\n        score += 0.3\n    \n    # BGM完整性（20%权重）\n    if\
          \ bgm:\n        score += 0.2\n    \n    # 数量奖励（20%权重）\n    total_count =\
          \ len(audio) + len(visual) + len(bgm)\n    if total_count >= 5:\n      \
          \  score += 0.2\n    elif total_count >= 3:\n        score += 0.1\n    \n\
          \    return min(1.0, score)\n\ndef get_quality_grade(quality_score: float)\
          \ -> str:\n    \"\"\"\n    获取质量等级\n    \"\"\"\n    if quality_score >= 0.9:\n\
          \        return 'A+'\n    elif quality_score >= 0.8:\n        return 'A'\n\
          \    elif quality_score >= 0.7:\n        return 'B+'\n    elif quality_score\
          \ >= 0.6:\n        return 'B'\n    elif quality_score >= 0.5:\n        return\
          \ 'C'\n    else:\n        return 'D'\n\ndef determine_convergence_status(completeness:\
          \ Dict[str, Any], quality: Dict[str, Any]) -> str:\n    \"\"\"\n    确定收敛状态\n\
          \    \"\"\"\n    if completeness['overall_complete'] and quality['overall_quality']\
          \ >= 0.7:\n        return 'success'\n    elif completeness['overall_complete']\
          \ and quality['overall_quality'] >= 0.5:\n        return 'partial_success'\n\
          \    elif completeness['total_count'] > 0:\n        return 'partial'\n \
          \   else:\n        return 'failed'\n\ndef create_fallback_response(audio:\
          \ List[Dict], visual: List[Dict], bgm: List[Dict]) -> Dict[str, Any]:\n\
          \    \"\"\"\n    创建降级响应\n    \"\"\"\n    return {\n        'converged_materials':\
