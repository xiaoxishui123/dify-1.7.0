          \      'bgm': bgm\n        },\n        'completeness_check': enhanced_completeness_check(audio,\
          \ visual, bgm),\n        'quality_assessment': assess_material_quality(audio,\
          \ visual, bgm),\n        'convergence_status': 'timeout_fallback',\n   \
