          \ 0) + 1\n        style_stats[style] = style_stats.get(style, 0) + 1\n \
          \   \n    return mood_stats, style_stats\n\ndef assess_data_quality(candidates:\
          \ List[Dict[str, Any]]) -> Dict[str, Any]:\n    \"\"\"\n    评估数据质量\n   \
          \ \"\"\"\n    if not candidates:\n        return {'overall_quality': 'poor',\
          \ 'score': 0, 'issues': ['no_candidates']}\n    \n    total_score = sum(c.get('overall_score',\
