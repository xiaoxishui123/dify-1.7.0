          \    \n    # 基础EQ设置\n    eq = {\n        'low_freq': 0,      # 低频调节 (-10\
          \ to +10)\n        'mid_freq': 0,      # 中频调节\n        'high_freq': 0, \
          \    # 高频调节\n        'presence': 0       # 临场感调节\n    }\n    \n    # 根据音乐风格调节EQ\n\
          \    if 'electronic' in style or 'edm' in style:\n        eq['low_freq']\
