    - data:
        code: "import json\nimport time\nimport logging\nfrom typing import Dict,\
          \ Any, List\n\n# 配置日志\nlogging.basicConfig(level=logging.INFO)\nlogger =\
          \ logging.getLogger(__name__)\n\n# 安全配置\nSAFETY_CONFIG = {\n    'max_processing_time':\
          \ 30,  # 最大处理时间（秒）\n    'max_bgm_results': 10,      # 最大BGM结果数量\n    'max_audio_results':\
          \ 20,    # 最大音频结果数量\n    'max_visual_results': 20,   # 最大视觉结果数量\n    'min_quality_score':\
          \ 0.3,   # 最低质量分数\n    'timeout_fallback': True    # 超时时使用降级处理\n}\n\ndef\
          \ main(audio_results: List[Dict], visual_results: List[Dict], bgm_results:\
          \ List[Dict]) -> Dict[str, Any]:\n    \"\"\"\n    智能收敛节点：素材收敛+完整性验证（增强安全机制）\n\
          \    \"\"\"\n    start_time = time.time()\n    \n    try:\n        # 输入验证和安全检查\n\
          \        audio_results = validate_input_list(audio_results, 'audio', SAFETY_CONFIG['max_audio_results'])\n\
          \        visual_results = validate_input_list(visual_results, 'visual',\
          \ SAFETY_CONFIG['max_visual_results'])\n        bgm_results = validate_input_list(bgm_results,\
          \ 'bgm', SAFETY_CONFIG['max_bgm_results'])\n        \n        # 收敛音频结果（安全处理）\n\
          \        processed_audio = safe_process_results(audio_results, 'audio')\n\
          \        \n        # 检查处理时间\n        if time.time() - start_time > SAFETY_CONFIG['max_processing_time']:\n\
          \            logger.warning(\"Processing timeout detected, using fallback\
          \ mode\")\n            return create_fallback_response(processed_audio,\
          \ [], [])\n        \n        # 收敛视觉结果（安全处理）\n        processed_visual =\
          \ safe_process_results(visual_results, 'visual')\n        \n        # 再次检查处理时间\n\
          \        if time.time() - start_time > SAFETY_CONFIG['max_processing_time']:\n\
          \            logger.warning(\"Processing timeout detected, using fallback\
          \ mode\")\n            return create_fallback_response(processed_audio,\
          \ processed_visual, [])\n        \n        # 收敛BGM结果（增强安全处理）\n        processed_bgm\
          \ = enhanced_safe_bgm_processing(bgm_results)\n        \n        # 完整性验证（增强版）\n\
          \        completeness_check = enhanced_completeness_check(\n           \
          \ processed_audio, processed_visual, processed_bgm\n        )\n        \n\
          \        # 质量评估\n        quality_assessment = assess_material_quality(\n\
          \            processed_audio, processed_visual, processed_bgm\n        )\n\
          \        \n        # 构建结果\n        result = {\n            'converged_materials':\
          \ {\n                'audio': processed_audio,\n                'visual':\
          \ processed_visual,\n                'bgm': processed_bgm\n            },\n\
          \            'completeness_check': completeness_check,\n            'quality_assessment':\
          \ quality_assessment,\n            'convergence_status': determine_convergence_status(completeness_check,\
          \ quality_assessment),\n            'total_materials': len(processed_audio)\
          \ + len(processed_visual) + len(processed_bgm),\n            'processing_time':\
          \ time.time() - start_time,\n            'safety_checks_passed': True\n\
          \        }\n        \n        logger.info(f\"Convergence completed successfully\
          \ in {result['processing_time']:.2f}s\")\n        return result\n    \n\
          \    except Exception as e:\n        logger.error(f\"Convergence processing\
          \ failed: {e}\")\n        return create_error_response(str(e), time.time()\
          \ - start_time)\n\ndef validate_input_list(input_list: Any, list_type: str,\
          \ max_size: int) -> List[Dict]:\n    \"\"\"\n    验证和清理输入列表\n    \"\"\"\n\
          \    if not isinstance(input_list, list):\n        logger.warning(f\"Invalid\
          \ {list_type} input type, converting to list\")\n        input_list = [input_list]\
          \ if input_list else []\n    \n    # 限制列表大小\n    if len(input_list) > max_size:\n\
          \        logger.warning(f\"{list_type} results truncated from {len(input_list)}\
          \ to {max_size}\")\n        input_list = input_list[:max_size]\n    \n \
          \   # 过滤无效项\n    valid_items = []\n    for item in input_list:\n       \
          \ if isinstance(item, dict) and item:\n            valid_items.append(item)\n\
          \    \n    return valid_items\n\ndef safe_process_results(results: List[Dict],\
          \ result_type: str) -> List[Dict]:\n    \"\"\"\n    安全处理结果列表\n    \"\"\"\
          \n    processed = []\n    \n    for i, result in enumerate(results):\n \
          \       try:\n            if result and isinstance(result, dict):\n    \
          \            # 检查状态\n                status = result.get('status', 'unknown')\n\
          \                if status in ['success', 'completed', 'ready']:\n     \
          \               # 添加安全属性\n                    safe_result = result.copy()\n\
          \                    safe_result.update({\n                        'processing_index':\
          \ i,\n                        'result_type': result_type,\n            \
          \            'safety_validated': True,\n                        'quality_score':\
          \ result.get('quality_score', 0.5)\n                    })\n           \
          \         \n                    # 质量过滤\n                    if safe_result['quality_score']\
          \ >= SAFETY_CONFIG['min_quality_score']:\n                        processed.append(safe_result)\n\
          \                    else:\n                        logger.warning(f\"Low\
          \ quality {result_type} result filtered out: {safe_result['quality_score']}\"\
          )\n        \n        except Exception as e:\n            logger.error(f\"\
          Error processing {result_type} result {i}: {e}\")\n            continue\n\
          \    \n    return processed\n\ndef enhanced_safe_bgm_processing(bgm_results:\
          \ List[Dict]) -> List[Dict]:\n    \"\"\"\n    增强的BGM安全处理，防止各种错误\n    \"\"\
          \"\n    safe_bgm_list = []\n    \n    if not bgm_results:\n        logger.info(\"\
          No BGM results to process\")\n        return safe_bgm_list\n    \n    for\
          \ i, bgm in enumerate(bgm_results):\n        try:\n            if not isinstance(bgm,\
          \ dict):\n                logger.warning(f\"Invalid BGM result type at index\
          \ {i}: {type(bgm)}\")\n                continue\n            \n        \
          \    # 创建安全副本\n            safe_bgm = {}\n            \n            # 必要属性处理\n\
          \            safe_bgm['id'] = bgm.get('id', f'bgm_{i+1}')\n            safe_bgm['rank']\
          \ = i + 1\n            safe_bgm['score'] = max(0.0, min(1.0, float(bgm.get('score',\
          \ 0.5))))\n            safe_bgm['title'] = str(bgm.get('title', f'BGM Track\
          \ {i+1}'))\n            safe_bgm['duration'] = max(0, float(bgm.get('duration',\
          \ 30)))\n            safe_bgm['url'] = str(bgm.get('url', ''))\n       \
          \     safe_bgm['status'] = bgm.get('status', 'available')\n            \n\
          \            # 可选属性处理\n            safe_bgm['artist'] = str(bgm.get('artist',\
          \ 'Unknown Artist'))\n            safe_bgm['genre'] = str(bgm.get('genre',\
          \ 'Unknown'))\n            safe_bgm['mood'] = str(bgm.get('mood', 'neutral'))\n\
          \            safe_bgm['energy'] = max(0.0, min(1.0, float(bgm.get('energy',\
          \ 0.5))))\n            \n            # 安全标记\n            safe_bgm['safety_processed']\
          \ = True\n            safe_bgm['processing_timestamp'] = time.time()\n \
          \           \n            # 质量检查\n            if safe_bgm['score'] >= SAFETY_CONFIG['min_quality_score']\
          \ and safe_bgm['url']:\n                safe_bgm_list.append(safe_bgm)\n\
          \            else:\n                logger.warning(f\"BGM result {i} filtered\
          \ out: score={safe_bgm['score']}, url_valid={bool(safe_bgm['url'])}\")\n\
          \        \n        except Exception as e:\n            logger.error(f\"\
          Error processing BGM result {i}: {e}\")\n            continue\n    \n  \
          \  # 按分数排序\n    safe_bgm_list.sort(key=lambda x: x['score'], reverse=True)\n\
          \    \n    logger.info(f\"Processed {len(safe_bgm_list)} valid BGM results\
          \ from {len(bgm_results)} inputs\")\n    return safe_bgm_list\n\ndef enhanced_completeness_check(audio:\
          \ List[Dict], visual: List[Dict], bgm: List[Dict]) -> Dict[str, Any]:\n\
          \    \"\"\"\n    增强的完整性检查\n    \"\"\"\n    return {\n        'audio_complete':\
          \ len(audio) > 0,\n        'visual_complete': len(visual) > 0,\n       \
          \ 'bgm_complete': len(bgm) > 0,\n        'overall_complete': len(audio)\
          \ > 0 and len(visual) > 0,\n        'audio_count': len(audio),\n       \
          \ 'visual_count': len(visual),\n        'bgm_count': len(bgm),\n       \
          \ 'total_count': len(audio) + len(visual) + len(bgm),\n        'completeness_score':\
          \ calculate_completeness_score(audio, visual, bgm)\n    }\n\ndef assess_material_quality(audio:\
          \ List[Dict], visual: List[Dict], bgm: List[Dict]) -> Dict[str, Any]:\n\
          \    \"\"\"\n    评估素材质量\n    \"\"\"\n    def avg_quality(materials: List[Dict])\
          \ -> float:\n        if not materials:\n            return 0.0\n       \
          \ scores = [m.get('quality_score', 0.5) for m in materials]\n        return\
          \ sum(scores) / len(scores)\n    \n    audio_quality = avg_quality(audio)\n\
