    - data:
        code: "\n# 输入参数验证\ndef validate_inputs(user_content, video_duration, aspect_ratio,\
          \ height):\n    errors = []\n    \n    if not user_content or len(user_content.strip())\
          \ < 10:\n        errors.append(\"用户内容不能为空且长度至少10个字符\")\n    \n    try:\n\
          \        duration = int(video_duration)\n        if duration < 10 or duration\
