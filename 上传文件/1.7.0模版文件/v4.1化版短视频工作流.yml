    - data:
        code: "import json\nimport time\nimport re\nfrom typing import Dict, Any,\
          \ List, Optional, Tuple\nfrom urllib.parse import urlparse\n\ndef main(spotify_results:\
          \ str, query_item: Dict[str, Any]) -> Dict[str, Any]:\n    \"\"\"\n    增强的Spotify结果处理器：处理Spotify搜索结果，转换为工作流标准格式\n\
          \    包含错误恢复机制、数据验证和API优化\n    \"\"\"\n    processing_start_time = time.time()\n\
          \    \n    try:\n        # 输入数据验证和预处理\n        validated_input = validate_and_preprocess_input(spotify_results,\
          \ query_item)\n        if not validated_input['is_valid']:\n           \
          \ return create_error_response(query_item, validated_input['error'], processing_start_time)\n\
          \        \n        search_data = validated_input['search_data']\n      \
          \  query_params = validated_input['query_params']\n        \n        # 处理Spotify音轨数据\n\
          \        bgm_candidates = []\n        tracks = search_data.get('tracks',\
          \ {}).get('items', [])\n        \n        # 智能选择处理数量（基于结果质量动态调整）\n     \
          \   max_tracks = determine_optimal_track_count(tracks, query_params)\n \
          \       \n        for i, track in enumerate(tracks[:max_tracks]):\n    \
          \        try:\n                # 处理单个音轨\n                processed_track\
          \ = process_single_track(track, i, query_params)\n                if processed_track\
          \ and is_track_suitable(processed_track, query_params):\n              \
          \      bgm_candidates.append(processed_track)\n            except Exception\
          \ as track_error:\n                # 单个音轨处理失败时继续处理其他音轨\n               \
          \ continue\n        \n        # 质量优化：对候选进行后处理\n        bgm_candidates =\
          \ optimize_candidates_quality(bgm_candidates, query_params)\n        \n\
          \        # 如果没有找到合适的结果，使用智能降级策略\n        if not bgm_candidates:\n      \
          \      bgm_candidates = create_smart_fallback_candidates(query_params, search_data)\n\
          \        \n        # 计算性能指标\n        processing_time = time.time() - processing_start_time\n\
          \        performance_metrics = calculate_performance_metrics(\n        \
          \    tracks, bgm_candidates, processing_time, query_params\n        )\n\
          \        \n        return {\n            'bgm_candidates': bgm_candidates,\n\
          \            'total_candidates': len(bgm_candidates),\n            'processing_status':\
          \ 'completed',\n            'query_info': query_params,\n            'performance_metrics':\
          \ performance_metrics,\n            'api_optimization': {\n            \
          \    'tracks_processed': len(tracks),\n                'candidates_generated':\
          \ len(bgm_candidates),\n                'processing_time_ms': round(processing_time\
          \ * 1000, 2),\n                'optimization_applied': True,\n         \
          \       'fallback_used': any(c.get('metadata', {}).get('type') == 'fallback'\
          \ for c in bgm_candidates)\n            },\n            'data_quality':\
          \ {\n                'input_validation_passed': True,\n                'output_validation_passed':\
          \ True,\n                'quality_score': calculate_overall_quality_score(bgm_candidates)\n\
          \            }\n        }\n    \n    except Exception as e:\n        # 全局错误恢复\n\
          \        return create_error_response(query_item, str(e), processing_start_time,\
          \ include_fallback=True)\n\ndef validate_and_preprocess_input(spotify_results:\
          \ Any, query_item: Dict[str, Any]) -> Dict[str, Any]:\n    \"\"\"\n    验证和预处理输入数据\n\
          \    \"\"\"\n    try:\n        # 验证query_item\n        if not isinstance(query_item,\
          \ dict):\n            return {'is_valid': False, 'error': 'Invalid query_item\
          \ format'}\n        \n        # 解析Spotify搜索结果\n        if isinstance(spotify_results,\
          \ str):\n            if not spotify_results.strip():\n                search_data\
          \ = {'tracks': {'items': []}}\n            else:\n                try:\n\
          \                    search_data = json.loads(spotify_results)\n       \
          \         except json.JSONDecodeError:\n                    # 尝试修复常见的JSON格式问题\n\
          \                    cleaned_results = clean_json_string(spotify_results)\n\
          \                    try:\n                        search_data = json.loads(cleaned_results)\n\
          \                    except:\n                        search_data = {'tracks':\
          \ {'items': []}}\n        elif isinstance(spotify_results, dict):\n    \
          \        search_data = spotify_results\n        else:\n            search_data\
          \ = {'tracks': {'items': []}}\n        \n        # 验证搜索数据结构\n        if\
          \ not isinstance(search_data, dict):\n            search_data = {'tracks':\
          \ {'items': []}}\n        \n        if 'tracks' not in search_data:\n  \
          \          search_data['tracks'] = {'items': []}\n        \n        if not\
          \ isinstance(search_data['tracks'], dict):\n            search_data['tracks']\
          \ = {'items': []}\n        \n        if 'items' not in search_data['tracks']:\n\
          \            search_data['tracks']['items'] = []\n        \n        # 提取和验证查询参数\n\
          \        query_params = {\n            'mood': str(query_item.get('mood',\
          \ 'neutral')).lower(),\n            'style': str(query_item.get('style',\
          \ 'modern')).lower(),\n            'duration': max(10, min(300, int(query_item.get('duration',\
          \ 60)))),  # 限制在10-300秒\n            'query_id': str(query_item.get('query_id',\
          \ f'query_{int(time.time())}')),\n            'energy_level': query_item.get('energy_level',\
          \ 'medium'),\n            'instrumental_preference': query_item.get('instrumental_preference',\
          \ True)\n        }\n        \n        return {\n            'is_valid':\
          \ True,\n            'search_data': search_data,\n            'query_params':\
          \ query_params\n        }\n    \n    except Exception as e:\n        return\
          \ {'is_valid': False, 'error': f'Input validation failed: {str(e)}'}\n\n\
          def clean_json_string(json_str: str) -> str:\n    \"\"\"\n    清理JSON字符串中的常见格式问题\n\
          \    \"\"\"\n    # 移除控制字符\n    json_str = re.sub(r'[\\x00-\\x1f\\x7f-\\\
          x9f]', '', json_str)\n    # 修复常见的引号问题\n    json_str = re.sub(r'([{,]\\s*)([a-zA-Z_][a-zA-Z0-9_]*)\\\
          s*:', r'\\1\"\\2\":', json_str)\n    return json_str\n\ndef determine_optimal_track_count(tracks:\
          \ List[Dict], query_params: Dict[str, Any]) -> int:\n    \"\"\"\n    基于结果质量和查询参数动态确定处理的音轨数量\n\
          \    \"\"\"\n    total_tracks = len(tracks)\n    if total_tracks == 0:\n\
          \        return 0\n    \n    # 基础处理数量\n    base_count = min(5, total_tracks)\n\
          \    \n    # 根据查询复杂度调整\n    if query_params.get('mood') in ['specific',\
          \ 'complex']:\n        base_count = min(8, total_tracks)\n    \n    # 根据可用音轨质量调整\n\
          \    high_quality_count = sum(1 for track in tracks[:10] if track.get('popularity',\
          \ 0) > 70)\n    if high_quality_count < 3:\n        base_count = min(10,\
          \ total_tracks)  # 扩大搜索范围\n    \n    return base_count\n\ndef process_single_track(track:\
          \ Dict[str, Any], index: int, query_params: Dict[str, Any]) -> Optional[Dict[str,\
          \ Any]]:\n    \"\"\"\n    处理单个音轨，包含错误恢复和数据验证\n    \"\"\"\n    try:\n   \
          \     # 基础信息提取\n        track_id = track.get('id', f'spotify_{index+1}')\n\
          \        track_name = clean_text_field(track.get('name', f'BGM Track {index+1}'))\n\
          \        \n        # 艺术家信息处理\n        artists = track.get('artists', [])\n\
          \        if not isinstance(artists, list):\n            artists = []\n \
          \       artist_names = [clean_text_field(artist.get('name', 'Unknown'))\
          \ for artist in artists if isinstance(artist, dict)]\n        if not artist_names:\n\
          \            artist_names = ['Unknown Artist']\n        \n        # 时长处理\n\
          \        duration_ms = track.get('duration_ms', 60000)\n        if not isinstance(duration_ms,\
          \ (int, float)) or duration_ms <= 0:\n            duration_ms = 60000\n\
          \        track_duration = duration_ms / 1000\n        \n        # URL处理\n\
          \        preview_url = track.get('preview_url', '')\n        external_urls\
          \ = track.get('external_urls', {})\n        spotify_url = external_urls.get('spotify',\
          \ '') if isinstance(external_urls, dict) else ''\n        \n        # 专辑信息\n\
          \        album = track.get('album', {})\n        album_name = clean_text_field(album.get('name',\
          \ 'Unknown Album')) if isinstance(album, dict) else 'Unknown Album'\n  \
          \      \n        # 增强的音频特征分析\n        audio_features = generate_enhanced_audio_features(track,\
          \ query_params)\n        \n        # 计算多维度相关性评分\n        relevance_score\
          \ = calculate_enhanced_relevance_score(track, query_params, audio_features)\n\
          \        \n        # 构建增强的BGM候选格式\n        bgm_candidate = {\n         \
          \   'id': track_id,\n            'title': track_name,\n            'artist':\
          \ ', '.join(artist_names),\n            'album': album_name,\n         \
          \   'url': preview_url or spotify_url,\n            'spotify_url': spotify_url,\n\
          \            'duration': track_duration,\n            'mood': query_params['mood'],\n\
          \            'style': query_params['style'],\n            'bpm': audio_features.get('tempo',\
          \ 120),\n            'genre': infer_genre_from_style(query_params['style']),\n\
          \            'license': 'spotify_licensed',\n            'overall_score':\
          \ relevance_score,\n            'quality_score': calculate_quality_score(track,\
          \ audio_features, relevance_score),\n            'relevance_score': relevance_score,\n\
          \            'popularity_score': normalize_popularity_score(track.get('popularity',\
          \ 50)),\n            'rank': index + 1,\n            'audio_features': audio_features,\n\
          \            'metadata': {\n                'source': 'spotify',\n     \
          \           'track_id': track_id,\n                'artists': artist_names,\n\
          \                'album': album_name,\n                'duration_ms': duration_ms,\n\
          \                'preview_available': bool(preview_url),\n             \
          \   'search_query': query_params,\n                'explicit': track.get('explicit',\
          \ False),\n                'processing_timestamp': int(time.time() * 1000),\n\
          \                'data_validated': True\n            },\n            'spotify_metadata':\
          \ {\n                'popularity': track.get('popularity', 0),\n       \
          \         'explicit': track.get('explicit', False),\n                'available_markets':\
          \ track.get('available_markets', []),\n                'disc_number': track.get('disc_number',\
          \ 1),\n                'track_number': track.get('track_number', 1),\n \
          \               'release_date': extract_release_date(album),\n         \
          \       'album_type': album.get('album_type', 'album') if isinstance(album,\
          \ dict) else 'album'\n            },\n            'enhanced_features': {\n\
          \                'mood_compatibility': calculate_mood_compatibility(audio_features,\
          \ query_params['mood']),\n                'style_compatibility': calculate_style_compatibility(audio_features,\
          \ query_params['style']),\n                'duration_fitness': calculate_duration_fitness(track_duration,\
          \ query_params['duration']),\n                'instrumental_score': audio_features.get('instrumentalness',\
          \ 0.5)\n            }\n        }\n        \n        return bgm_candidate\n\
          \    \n    except Exception as e:\n        # 单个音轨处理失败时返回None，让调用者继续处理其他音轨\n\
          \        return None\n\ndef generate_enhanced_audio_features(track: Dict[str,\
          \ Any], query_params: Dict[str, Any]) -> Dict[str, Any]:\n    \"\"\"\n \
          \   生成增强的音频特征（基于可用数据和启发式规则）\n    \"\"\"\n    # 基础特征\n    features = {\n\
          \        'energy': 0.7,\n        'valence': 0.6,\n        'danceability':\
          \ 0.5,\n        'tempo': 120,\n        'acousticness': 0.3,\n        'instrumentalness':\
          \ 0.8,\n        'speechiness': 0.1,\n        'liveness': 0.2\n    }\n  \
          \  \n    # 基于心情调整特征\n    mood = query_params.get('mood', 'neutral')\n  \
          \  if mood in ['happy', 'excited', 'energetic']:\n        features.update({\n\
          \            'energy': 0.8,\n            'valence': 0.8,\n            'danceability':\
          \ 0.7,\n            'tempo': 130\n        })\n    elif mood in ['calm',\
          \ 'peaceful', 'relaxed']:\n        features.update({\n            'energy':\
          \ 0.3,\n            'valence': 0.5,\n            'acousticness': 0.7,\n\
          \            'tempo': 90\n        })\n    elif mood in ['sad', 'melancholic']:\n\
          \        features.update({\n            'energy': 0.4,\n            'valence':\
          \ 0.2,\n            'acousticness': 0.6,\n            'tempo': 80\n    \
          \    })\n    \n    # 基于风格调整特征\n    style = query_params.get('style', 'modern')\n\
          \    if style in ['electronic', 'edm']:\n        features.update({\n   \
          \         'energy': 0.9,\n            'danceability': 0.8,\n           \
          \ 'acousticness': 0.1,\n            'instrumentalness': 0.9\n        })\n\
          \    elif style in ['acoustic', 'folk']:\n        features.update({\n  \
          \          'acousticness': 0.9,\n            'instrumentalness': 0.7,\n\
          \            'energy': 0.4\n        })\n    \n    # 基于流行度调整\n    popularity\
          \ = track.get('popularity', 50)\n    if popularity > 80:\n        features['energy']\
          \ = min(1.0, features['energy'] + 0.1)\n        features['danceability']\
          \ = min(1.0, features['danceability'] + 0.1)\n    \n    return features\n\
          \ndef calculate_enhanced_relevance_score(track: Dict[str, Any], query_params:\
          \ Dict[str, Any], audio_features: Dict[str, Any]) -> float:\n    \"\"\"\n\
          \    计算增强的多维度相关性评分\n    \"\"\"\n    try:\n        score_components = {\n\
          \            'mood_match': 0.0,\n            'style_match': 0.0,\n     \
          \       'popularity': 0.0,\n            'audio_quality': 0.0,\n        \
          \    'duration_fit': 0.0,\n            'instrumental': 0.0\n        }\n\
          \        \n        # 心情匹配评分 (30%)\n        mood = query_params.get('mood',\
          \ 'neutral')\n        score_components['mood_match'] = calculate_mood_compatibility(audio_features,\
          \ mood) * 0.3\n        \n        # 风格匹配评分 (25%)\n        style = query_params.get('style',\
          \ 'modern')\n        score_components['style_match'] = calculate_style_compatibility(audio_features,\
          \ style) * 0.25\n        \n        # 流行度评分 (15%)\n        popularity = normalize_popularity_score(track.get('popularity',\
          \ 50))\n        score_components['popularity'] = popularity * 0.15\n   \
          \     \n        # 音频质量评分 (15%)\n        score_components['audio_quality']\
          \ = calculate_audio_quality_score(track, audio_features) * 0.15\n      \
          \  \n        # 时长适配评分 (10%)\n        track_duration = track.get('duration_ms',\
          \ 60000) / 1000\n        target_duration = query_params.get('duration',\
          \ 60)\n        score_components['duration_fit'] = calculate_duration_fitness(track_duration,\
          \ target_duration) * 0.1\n        \n        # 器乐性评分 (5%)\n        score_components['instrumental']\
          \ = audio_features.get('instrumentalness', 0.5) * 0.05\n        \n     \
          \   # 计算总分\n        total_score = sum(score_components.values())\n     \
          \   \n        # 应用质量加成\n        if track.get('preview_url'):\n         \
          \   total_score *= 1.1  # 有预览的音轨加成\n        \n        # 确保评分在0-1范围内\n  \
          \      return max(0.0, min(1.0, total_score))\n        \n    except Exception:\n\
          \        return 0.5\n\ndef optimize_candidates_quality(candidates: List[Dict[str,\
          \ Any]], query_params: Dict[str, Any]) -> List[Dict[str, Any]]:\n    \"\"\
          \"\n    优化候选质量：重新排序、过滤和增强\n    \"\"\"\n    if not candidates:\n        return\
          \ candidates\n    \n    # 过滤低质量候选\n    filtered_candidates = [\n       \
          \ c for c in candidates \n        if c.get('overall_score', 0) >= 0.2 and\
          \ c.get('duration', 0) >= 10\n    ]\n    \n    # 如果过滤后太少，放宽标准\n    if len(filtered_candidates)\
          \ < 2:\n        filtered_candidates = candidates\n    \n    # 重新排序：综合评分\
          \ + 多样性\n    sorted_candidates = sorted(\n        filtered_candidates, \n\
          \        key=lambda x: (\n            x.get('overall_score', 0) * 0.7 +\
          \ \n            x.get('popularity_score', 0) * 0.2 + \n            (1.0\
          \ if x.get('url') else 0.5) * 0.1\n        ), \n        reverse=True\n \
          \   )\n    \n    # 重新分配排名\n    for i, candidate in enumerate(sorted_candidates):\n\
          \        candidate['rank'] = i + 1\n        candidate['optimization_applied']\
          \ = True\n    \n    return sorted_candidates\n\ndef create_smart_fallback_candidates(query_params:\
          \ Dict[str, Any], search_data: Dict[str, Any]) -> List[Dict[str, Any]]:\n\
          \    \"\"\"\n    创建智能降级候选，基于查询参数生成多个备选方案\n    \"\"\"\n    fallback_candidates\
          \ = []\n    \n    # 主要降级候选\n    primary_fallback = create_enhanced_fallback_bgm(query_params,\
          \ 'primary')\n    fallback_candidates.append(primary_fallback)\n    \n \
          \   # 如果有部分搜索结果但质量不佳，尝试创建基于搜索结果的降级\n    tracks = search_data.get('tracks',\
          \ {}).get('items', [])\n    if tracks:\n        for i, track in enumerate(tracks[:2]):\
          \  # 最多2个降级候选\n            try:\n                fallback = create_track_based_fallback(track,\
          \ query_params, i + 1)\n                if fallback:\n                 \
          \   fallback_candidates.append(fallback)\n            except:\n        \
          \        continue\n    \n    # 如果仍然没有足够的候选，添加通用降级\n    if len(fallback_candidates)\
          \ < 2:\n        generic_fallback = create_enhanced_fallback_bgm(query_params,\
          \ 'generic')\n        fallback_candidates.append(generic_fallback)\n   \
          \ \n    return fallback_candidates\n\ndef create_enhanced_fallback_bgm(query_params:\
          \ Dict[str, Any], fallback_type: str = 'primary') -> Dict[str, Any]:\n \
          \   \"\"\"\n    创建增强的降级BGM\n    \"\"\"\n    mood = query_params.get('mood',\
          \ 'neutral')\n    style = query_params.get('style', 'modern')\n    duration\
          \ = query_params.get('duration', 60)\n    query_id = query_params.get('query_id',\
          \ 'default')\n    \n    # 基于心情和风格生成合适的降级音乐\n    fallback_configs = {\n \
          \       'primary': {\n            'title': f'{mood.title()} {style.title()}\
          \ BGM',\n            'score': 0.4,\n            'url': f'https://api.bgm-service.com/{mood}_{style}.mp3'\n\
          \        },\n        'generic': {\n            'title': '通用背景音乐',\n    \
          \        'score': 0.3,\n            'url': 'https://api.bgm-service.com/default.mp3'\n\
          \        }\n    }\n    \n    config = fallback_configs.get(fallback_type,\
          \ fallback_configs['primary'])\n    \n    return {\n        'id': f\"fallback_{fallback_type}_{query_id}\"\
          ,\n        'title': config['title'],\n        'artist': 'AI Generated',\n\
          \        'album': 'System Fallback Collection',\n        'url': config['url'],\n\
          \        'duration': duration,\n        'mood': mood,\n        'style':\
