          \ >= 0.4:\n        return True\n    \n    # 其他情况继续迭代\n    return False\n\
          \ndef get_completion_reason_enhanced(aggregated_results: List[Dict], best_candidate:\
          \ Dict, avg_score: float, total_results: int) -> str:\n    \"\"\"\n    获取增强的迭代完成原因\n\
