          \ audio_features['pitch_range']['max_hz']],\n                'complement_frequency_range':\
          \ [50, 80, 8000, 16000]\n            }\n        }\n        \n        processed_audio_segment\
          \ = {\n            'segment_id': segment_id,\n            'audio_url': audio_url,\n\
          \            'text': text,\n            'duration': duration,\n        \
          \    'subtitle_data': aligned_subtitle,\n            'audio_analysis_config':\
          \ audio_analysis_config,\n            'audio_features': audio_features,\n\
          \            'emotion_analysis': emotion_confidence,\n            'bgm_matching_hints':\
          \ bgm_matching_hints,\n            'beat_detection_params': beat_detection_params,\n\
          \            'processing_status': 'completed',\n            'quality_score':\
