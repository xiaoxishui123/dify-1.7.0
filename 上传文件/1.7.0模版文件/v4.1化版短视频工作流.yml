          \    # 删除旧的，添加新的\n                del unique_candidates[existing_id]\n \
          \               unique_candidates[bgm_id] = candidate\n                url_map[bgm_url]\
          \ = bgm_id\n        else:\n            # 新的候选\n            unique_candidates[bgm_id]\
          \ = candidate\n            if bgm_url:\n                url_map[bgm_url]\
          \ = bgm_id\n    \n    return unique_candidates\n\ndef normalize_candidate_data(candidates:\
          \ List[Dict[str, Any]]) -> List[Dict[str, Any]]:\n    \"\"\"\n    标准化候选数据\n\
          \    \"\"\"\n    for i, candidate in enumerate(candidates):\n        # 重新分配排名\n\
