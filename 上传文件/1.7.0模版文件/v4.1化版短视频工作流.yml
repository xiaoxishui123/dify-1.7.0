          \   }\n    return style_genre_map.get(style.lower(), 'Contemporary')\n\n\
          def extract_release_date(album: Dict[str, Any]) -> str:\n    \"\"\"提取发布日期\"\
          \"\"\n    if not isinstance(album, dict):\n        return ''\n    return\
