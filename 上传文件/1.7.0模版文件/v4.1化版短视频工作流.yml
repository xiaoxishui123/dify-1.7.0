          \        candidate['data_validated'] = True\n        candidate['validation_timestamp']\
          \ = int(time.time() * 1000)\n        \n        cleaned.append(candidate)\n\
          \    \n    return cleaned\n\ndef deduplicate_candidates(candidates: List[Dict[str,\
          \ Any]]) -> Dict[str, Dict[str, Any]]:\n    \"\"\"\n    基于ID和URL去重\n   \
          \ \"\"\"\n    unique_candidates = {}\n    url_map = {}  # URL到ID的映射，用于检测URL重复\n\
          \    \n    for candidate in candidates:\n        bgm_id = candidate.get('id',\
