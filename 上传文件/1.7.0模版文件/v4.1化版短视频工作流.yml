          \ str, processing_time: float) -> Dict[str, Any]:\n    \"\"\"\n    创建错误响应\n\
          \    \"\"\"\n    return {\n        'error': error_msg,\n        'convergence_status':\
          \ 'failed',\n        'total_materials': 0,\n        'processing_time': processing_time,\n\
          \        'safety_checks_passed': False,\n        'converged_materials':\
          \ {\n            'audio': [],\n            'visual': [],\n            'bgm':\
