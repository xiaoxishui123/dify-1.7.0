openapi: 3.1.0
info:
  title: TTS Gateway - 豆包语音合成
  version: "1.0.0"
  description: 豆包(火山引擎)语音合成网关，将文本转换为语音并返回音频URL
servers:
  - url: http://8.148.70.18:3006
paths:
  /api/v1/tts:
    post:
      operationId: tts_synthesize
      summary: 文本转语音合成
      description: 输入文本和音色参数，返回合成的音频URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, voice_type]
              properties:
                text:
                  type: string
                  description: 要合成的文本内容
                  example: "这是一段测试文本"
                voice_type:
                  type: string
                  description: 音色类型
                  example: "zh_male_dongfanghaoran_moon_bigtts"
                  enum:
                    - "zh_male_dongfanghaoran_moon_bigtts"
                    - "zh_female_tianmei_moon_bigtts"
                    - "zh_male_zhigang_moon_bigtts"
                    - "zh_female_siyue_moon_bigtts"
                    - "zh_male_kaikai_moon_bigtts"
                    - "zh_female_xiaoyu_moon_bigtts"
                    - "zh_male_zhengqi_moon_bigtts"
                    - "zh_female_xiaomo_moon_bigtts"
                    - "zh_male_zhihao_moon_bigtts"
                    - "zh_female_xiaoxin_moon_bigtts"
                speed_ratio:
                  type: string
                  description: 语速比例（字符串格式，支持Dify变量表达式）
                  default: "1.0"
                  example: "1.0"
                audio_format:
                  type: string
                  description: 音频格式
                  enum: [mp3, wav]
                  default: mp3
                sample_rate:
                  type: integer
                  description: 采样率
                  enum: [16000, 24000, 44100, 48000]
                  default: 24000
      responses:
        "200":
          description: 成功返回音频URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  audio_url:
                    type: string
                    format: uri
                    description: 可直接访问的音频文件URL
                  duration:
                    type: number
                    description: 音频时长（秒）
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 错误信息
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: 错误信息