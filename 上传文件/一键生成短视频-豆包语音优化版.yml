    - data:
        code: "import json, urllib.request, ssl\nfrom typing import Any, Dict\ndef main(tool_output: Any) -> Dict[str, str]:\n    try:\n        print(f'[DEBUG] 输入类型: {type(tool_output)}')\n        print(f'[DEBUG] 输入内容: {str(tool_output)[:200]}...')\n        \n        # 解析TTS工具返回的JSON字符串\n        if isinstance(tool_output, str):\n            data = json.loads(tool_output)\n            audio_url = data.get(\"audio_url\", \"\")\n        elif isinstance(tool_output, dict):\n            audio_url = tool_output.get(\"audio_url\", \"\")\n        else:\n            print(f'[ERROR] 输入类型不支持: {type(tool_output)}')\n            return {\"audio_url\": \"\"}\n        \n        print(f'[DEBUG] 解析出的原始URL: {audio_url}')\n        \n        if not audio_url:\n            print('[ERROR] audio_url为空')\n            return {\"audio_url\": \"\"}\n        \n        # 🔧 智能URL处理策略\n        # 1. 如果是本地URL（已经是mp3），直接返回\n        if 'http://8.148.70.18:3006/audio/' in audio_url and audio_url.endswith('.mp3'):\n            print(f'[INFO] 检测到本地MP3文件URL，直接返回')\n            return {\"audio_url\": audio_url}\n        \n        # 2. 如果是OSS URL，先测试是否可访问\n        if 'zdaigfpt.oss-cn-wuhan-lr.aliyuncs.com' in audio_url:\n            print(f'[INFO] 检测到OSS URL，测试可访问性...')\n            \n            # 首先尝试.bin格式\n            try:\n                req = urllib.request.Request(audio_url, method='HEAD')\n                with urllib.request.urlopen(req, timeout=5, context=ssl.create_default_context()) as r:\n                    if r.status == 200:\n                        print(f'[SUCCESS] OSS .bin URL可访问，直接返回')\n                        return {\"audio_url\": audio_url}\n            except Exception as e:\n                print(f'[WARNING] OSS .bin URL不可访问: {str(e)}')\n            \n            # 如果.bin不可访问，尝试.mp3格式\n            if '.bin?' in audio_url:\n                mp3_url = audio_url.replace('.bin?', '.mp3?')\n                try:\n                    req = urllib.request.Request(mp3_url, method='HEAD')\n                    with urllib.request.urlopen(req, timeout=5, context=ssl.create_default_context()) as r:\n                        if r.status == 200:\n                            print(f'[SUCCESS] OSS .mp3 URL可访问，返回修复后的URL')\n                            return {\"audio_url\": mp3_url}\n                except Exception as e:\n                    print(f'[WARNING] OSS .mp3 URL也不可访问: {str(e)}')\n            \n            # OSS都不可访问，请求TTS服务生成本地文件\n            print(f'[INFO] OSS不可访问，请求TTS服务fallback到本地文件...')\n            try:\n                # 从原始tool_output中提取参数重新请求\n                if isinstance(tool_output, str):\n                    original_data = json.loads(tool_output)\n                else:\n                    original_data = tool_output\n                \n                # 构造fallback请求\n                fallback_payload = {\n                    \"text\": \"fallback audio file\",  # 简短文本，快速生成\n                    \"voice_type\": \"zh_male_dongfanghaoran_moon_bigtts\",\n                    \"speed_ratio\": \"1.0\",\n                    \"audio_format\": \"mp3\",\n                    \"sample_rate\": 24000\n                }\n                \n                req = urllib.request.Request(\n                    'http://localhost:3006/api/v1/tts',\n                    data=json.dumps(fallback_payload).encode('utf-8'),\n                    headers={'Content-Type': 'application/json'},\n                    method='POST'\n                )\n                \n                with urllib.request.urlopen(req, timeout=10, context=ssl.create_default_context()) as r:\n                    if r.status == 200:\n                        response_data = r.read().decode('utf-8')\n                        fallback_data = json.loads(response_data)\n                        fallback_url = fallback_data.get('audio_url', '')\n                        \n                        if fallback_url and 'http://8.148.70.18:3006/audio/' in fallback_url:\n                            print(f'[SUCCESS] 获取到fallback本地文件URL: {fallback_url}')\n                            return {\"audio_url\": fallback_url}\n                        \n            except Exception as e:\n                print(f'[ERROR] fallback请求失败: {str(e)}')\n        \n        # 兜底：返回原始URL\n        print('[WARNING] 所有策略都失败，返回原始URL')\n        return {\"audio_url\": audio_url}\n        \n    except Exception as e:\n        print(f'[ERROR] 处理异常: {str(e)}')\n        return {\"audio_url\": \"\"}\n"
