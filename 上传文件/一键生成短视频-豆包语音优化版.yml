    - data:
        code: "\nfrom typing import Any, Dict\nimport ssl, urllib.request, urllib.error,\
          \ json, uuid\nfrom urllib.parse import urlparse\n\nDEF_PREFIX = 'capcut/videos'\n\
          DEFAULT_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\
          \ (KHTML, like Gecko) Chrome/124.0 Safari/537.36'\n\ndef _pick_url(files:\
          \ Any) -> str:\n    # Prefer remote/signed URL first, then local tool url\n\
          \    if isinstance(files, dict) and isinstance(files.get('files'), list):\n\
          \        files = files['files']\n    if isinstance(files, list):\n     \
          \   for f in files:\n            if isinstance(f, dict):\n             \
          \   u = f.get('remote_url') or f.get('signed_url') or f.get('file_url')\
          \ or f.get('url')\n                if isinstance(u, str) and u.strip():\n\
          \                    return u.strip()\n    return ''\n\n\ndef _http_json(api_base_url:\
          \ str, path: str, payload: Dict[str, Any]) -> Dict[str, Any]:\n    req =\
          \ urllib.request.Request(\n        url=f\"{api_base_url.rstrip('/')}/{path.lstrip('/')}\"\
          ,\n        data=json.dumps(payload).encode('utf-8'),\n        headers={'Content-Type':\
          \ 'application/json'},\n        method='POST',\n    )\n    ctx = ssl.create_default_context()\n\
          \    with urllib.request.urlopen(req, timeout=120, context=ctx) as resp:\n\
          \        return json.loads(resp.read().decode('utf-8'))\n\n\ndef _http_multipart(api_base_url:\
          \ str, filename: str, content: bytes, content_type: str) -> Dict[str, Any]:\n\
          \    boundary = '----DifyBoundary' + uuid.uuid4().hex\n    ct = content_type\
          \ or 'application/octet-stream'\n    parts = []\n    parts.append(f\"--{boundary}\\\
          r\\nContent-Disposition: form-data; name=\\\"prefix\\\"\\r\\n\\r\\n{DEF_PREFIX}\\\
          r\\n\")\n    header = (\n        f\"--{boundary}\\r\\n\"\n        f\"Content-Disposition:\
          \ form-data; name=\\\"file\\\"; filename=\\\"{filename}\\\"\\r\\n\"\n  \
          \      f\"Content-Type: {ct}\\r\\n\\r\\n\"\n    ).encode('utf-8')\n    tail\
          \ = f\"\\r\\n--{boundary}--\\r\\n\".encode('utf-8')\n    body = b''.join([p.encode('utf-8')\
          \ for p in parts]) + header + content + tail\n    req = urllib.request.Request(\n\
          \        url=f\"{api_base_url.rstrip('/')}/upload_to_oss\",\n        data=body,\n\
          \        headers={'Content-Type': f'multipart/form-data; boundary={boundary}'},\n\
          \        method='POST',\n    )\n    ctx = ssl.create_default_context()\n\
          \    with urllib.request.urlopen(req, timeout=180, context=ctx) as resp:\n\
          \        return json.loads(resp.read().decode('utf-8'))\n\n\ndef _download(url:\
          \ str):\n    headers = {'User-Agent': DEFAULT_UA}\n    try:\n        p =\
          \ urlparse(url)\n        if p.scheme in ('http','https'):\n            headers['Referer']\
          \ = f\"{p.scheme}://{p.netloc}\"\n    except Exception:\n        pass\n\
          \    req = urllib.request.Request(url, method='GET', headers=headers)\n\
          \    ctx = ssl.create_default_context()\n    with urllib.request.urlopen(req,\
          \ timeout=180, context=ctx) as r:\n        data = r.read()\n        ct =\
          \ r.headers.get('Content-Type', '')\n        return data, ct\n\n\ndef main(video_url:\
          \ Any, api_base_url: str) -> Dict[str, str]:\n    url = _pick_url(video_url)\
          \ if isinstance(video_url, (dict, list)) else (video_url or '')\n    if\
          \ not isinstance(api_base_url, str) or not api_base_url.strip():\n     \
          \   return {'oss_url': url or ''}\n    if not url:\n        return {'oss_url':\
          \ ''}\n    # 1) try direct upload via multipart (most robust)\n    try:\n\
          \        data, ct = _download(url)\n        out = _http_multipart(api_base_url,\
          \ 'video.mp4', data, ct or 'video/mp4')\n        oss = (out.get('oss_url')\
          \ or '').strip()\n        if oss:\n            return {'oss_url': oss}\n\
          \    except Exception:\n        pass\n    # 2) fallback to mirror_by_url\n\
          \    try:\n        out = _http_json(api_base_url, 'mirror_to_oss', {'url':\
          \ url, 'prefix': DEF_PREFIX})\n        oss = (out.get('oss_url') or '').strip()\n\
          \        if oss:\n            return {'oss_url': oss}\n    except Exception:\n\
          \        pass\n    # 3) last resort return original\n    return {'oss_url':\
          \ url}\n"
