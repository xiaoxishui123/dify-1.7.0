          \  if not isinstance(srt, str):\n        return {\"text\": \"\"}\n    lines\
          \ = []\n    for raw in srt.splitlines():\n        t = raw.strip()\n    \
          \    if not t or t.isdigit() or '-->' in t:\n            continue\n    \
          \    lines.append(t)\n    text = '。'.join(lines)\n    while '。。' in text:\n\
          \        text = text.replace('。。', '。')\n    return {'text': text}\n"
