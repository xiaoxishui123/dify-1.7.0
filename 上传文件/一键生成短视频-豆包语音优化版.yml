app:
  description: 使用豆包TTS优化的一键生成短视频工作流。支持多种音色选择、语速调节，集成了豆包文生图、图生视频和语音合成功能。
  icon: 🎞️
  icon_background: '#E6F4FF'
  mode: advanced-chat
  name: 一键生成短视频-豆包语音优化版
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
