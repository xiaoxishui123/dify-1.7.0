kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      - .MP4
      - .MOV
      - .MP3
      - .WAV
      allowed_file_types:
      - image
      - video
      - audio
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 5
    opening_statement: '🎬 **豆包语音优化版短视频生成工具**


      ✨ **功能特点**：

      - 🎙️ 10种豆包音色可选（男声/女声）

      - ⚡ 语速自由调节（0.5x-2.0x）

      - 🎵 高品质音频合成

      - 🖼️ AI文生图/文生视频

      - 🎬 专业视频制作流程


      📝 **使用说明**：

      1. 输入视频主题或脚本

      2. 选择AI素材类型

      3. 配置音色和语速

      4. 设置视频参数

      5. 一键生成专业短视频


      🚀 **开始创作您的精彩视频吧！**

      '
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 帮我制作一个关于春天的短视频
    - 生成一个科技产品介绍视频
    - 创作一个美食制作教程视频
    - 制作一个旅游景点推广视频
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
