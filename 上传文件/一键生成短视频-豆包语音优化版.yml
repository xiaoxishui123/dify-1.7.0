    - data:
        code: "from typing import Any, Dict, Tuple\nimport ssl, urllib.request, urllib.error,\
          \ json, uuid, mimetypes\n\nDEF_PREFIX = 'capcut/images'\nDEFAULT_REFERER\
          \ = 'http://8.148.70.18:8080'\nDEFAULT_UA = 'Mozilla/5.0 (Windows NT 10.0;\
          \ Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'\n\
          \ndef _pick_file(files: Any) -> Tuple[str, str, str]:\n    \"\"\"Return\
          \ (url, filename, content_type) if possible.\n    content_type may be empty\
          \ if unknown.\n    \"\"\"\n    url = ''\n    filename = 'upload.bin'\n \
          \   content_type = ''\n    if isinstance(files, dict) and isinstance(files.get('files'),\
          \ list):\n        files = files['files']\n    if isinstance(files, list)\
          \ and files:\n        f = files[0] if isinstance(files[0], dict) else None\n\
          \        if isinstance(f, dict):\n            url = (f.get('url') or f.get('remote_url')\
          \ or f.get('signed_url') or f.get('file_url') or '').strip()\n         \
          \   name = f.get('filename') or f.get('name') or ''\n            ext = f.get('extension')\
          \ or ''\n            mt = f.get('mime_type') or ''\n            if name:\n\
          \                filename = name\n            elif ext:\n              \
          \  filename = 'upload' + (ext if ext.startswith('.') else ('.' + ext))\n\
          \            # derive mime\n            if isinstance(mt, str) and mt.strip():\n\
          \                content_type = mt.strip()\n            elif isinstance(filename,\
          \ str):\n                guessed = mimetypes.guess_type(filename)[0]\n \
          \               if guessed:\n                    content_type = guessed\n\
          \    return url, filename, content_type\n\n\ndef _http_json(api_base_url:\
          \ str, path: str, payload: Dict[str, Any]) -> Dict[str, Any]:\n    req =\
          \ urllib.request.Request(\n        url=f\"{api_base_url.rstrip('/')}/{path.lstrip('/')}\"\
          ,\n        data=json.dumps(payload).encode('utf-8'),\n        headers={'Content-Type':\
          \ 'application/json'},\n        method='POST',\n    )\n    ctx = ssl.create_default_context()\n\
          \    with urllib.request.urlopen(req, timeout=30, context=ctx) as resp:\n\
          \        return json.loads(resp.read().decode('utf-8'))\n\n\ndef _http_multipart(api_base_url:\
          \ str, filename: str, content: bytes, content_type: str) -> Dict[str, Any]:\n\
          \    boundary = '----DifyBoundary' + uuid.uuid4().hex\n    ct = content_type\
          \ or 'application/octet-stream'\n    # build body\n    parts = []\n    parts.append(f\"\
          --{boundary}\\r\\nContent-Disposition: form-data; name=\\\"prefix\\\"\\\
          r\\n\\r\\n{DEF_PREFIX}\\r\\n\")\n    header = (\n        f\"--{boundary}\\\
          r\\n\"\n        f\"Content-Disposition: form-data; name=\\\"file\\\"; filename=\\\
          \"{filename}\\\"\\r\\n\"\n        f\"Content-Type: {ct}\\r\\n\\r\\n\"\n\
          \    ).encode('utf-8')\n    tail = f\"\\r\\n--{boundary}--\\r\\n\".encode('utf-8')\n\
          \    body = b''.join([p.encode('utf-8') for p in parts]) + header + content\
          \ + tail\n    req = urllib.request.Request(\n        url=f\"{api_base_url.rstrip('/')}/upload_to_oss\"\
          ,\n        data=body,\n        headers={'Content-Type': f'multipart/form-data;\
          \ boundary={boundary}'},\n        method='POST',\n    )\n    ctx = ssl.create_default_context()\n\
          \    with urllib.request.urlopen(req, timeout=60, context=ctx) as resp:\n\
          \        return json.loads(resp.read().decode('utf-8'))\n\n\ndef _try_upload(api_base_url:\
          \ str, file_url: str, filename: str, content_type: str) -> str:\n    # download\
          \ bytes from file_url with headers (avoid 403)\n    ctx = ssl.create_default_context()\n\
          \    req = urllib.request.Request(file_url, method='GET', headers={'Referer':\
          \ DEFAULT_REFERER, 'User-Agent': DEFAULT_UA})\n    try:\n        with urllib.request.urlopen(req,\
          \ timeout=60, context=ctx) as r:\n            data = r.read()\n        \
          \    ct = content_type or r.headers.get('Content-Type', '')\n        out\
          \ = _http_multipart(api_base_url, filename, data, ct or content_type)\n\
          \        return (out.get('oss_url') or '').strip()\n    except Exception:\n\
          \        return ''\n\n\ndef _try_mirror(api_base_url: str, file_url: str)\
          \ -> str:\n    try:\n        out = _http_json(api_base_url, 'mirror_to_oss',\
          \ {'url': file_url, 'prefix': DEF_PREFIX})\n        return (out.get('oss_url')\
          \ or '').strip()\n    except Exception:\n        return ''\n\n\ndef main(files:\
          \ Any, api_base_url: str) -> Dict[str, str]:\n    url, filename, content_type\
          \ = _pick_file(files)\n    if not isinstance(api_base_url, str) or not api_base_url.strip():\n\
          \        return {'oss_url': url or ''}\n    if not url:\n        return\
          \ {'oss_url': ''}\n    # 1) prefer direct upload (multipart)\n    oss =\
          \ _try_upload(api_base_url, url, filename, content_type)\n    if not oss:\n\
          \        # 2) fallback to mirror by url\n        oss = _try_mirror(api_base_url,\
          \ url)\n    return {'oss_url': oss or url}\n"
